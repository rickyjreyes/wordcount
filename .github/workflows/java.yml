name: Java
on:
  push:
    branches: [master, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: modern/pom.xml
      - name: Compile historical coursework (unaltered)
        run: javac source_code/*.java
      - name: Test and package modern companion
        run: mvn -B -f modern/pom.xml verify
      - name: Smoke test modern CLI on historical sample
        run: |
          java -jar modern/target/wordcount-lab-1.0.0.jar compare --input sample_text/hamlet.txt
          java -jar modern/target/wordcount-lab-1.0.0.jar count --input sample_text/hamlet.txt --top 5
      - name: Verify experimental sorting competitors and audit
        run: |
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset random --size 512 --seed 2017 --runs 2 --warmup 0
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset sorted --size 512 --seed 2017 --runs 2 --warmup 0
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset reverse --size 512 --seed 2017 --runs 2 --warmup 0
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --input sample_text/hamlet.txt --methods jdk,merge,wct,rca,prime,crypto,hybrid --runs 2 --warmup 0
      - name: Exploratory competition matrix (not JMH)
        run: |
          for shape in random sorted reverse nearly few-counts equal runs; do
            java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset "$shape" --size 2048 --seed 2017 --runs 7 --warmup 2
          done
          for n in 128 512 2048 8192; do
            java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset random --size "$n" --seed 2017 --runs 7 --warmup 2
          done
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --input sample_text/hamlet.txt --seed 2017 --runs 7 --warmup 2
      - name: Verify expanded full-sort competitors and separate Top-K task
        run: |
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset sparse --size 512 --seed 2017 --methods jdk-native,merge,freqbucket,radix,sparsebucket,pdq,parallel --runs 2 --warmup 0
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset zipf --size 2048 --seed 2017 --methods jdk-native,merge,freqbucket,radix,sparsebucket,pdq,parallel --runs 3 --warmup 1
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset unicode --size 1024 --seed 2017 --methods jdk-native,merge,freqbucket,radix,sparsebucket,pdq,parallel --runs 2 --warmup 0
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ExperimentLab --dataset prefix --size 1024 --seed 2017 --methods jdk-native,merge,freqbucket,radix,sparsebucket,pdq,parallel --runs 2 --warmup 0
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.TopKLab --dataset random --size 8192 --top 10 --seed 2017 --runs 5 --warmup 1
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.TopKLab --dataset equal --size 512 --top 1000 --seed 2017 --runs 2 --warmup 0
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.TopKLab --input sample_text/hamlet.txt --top 10 --seed 2017 --runs 3 --warmup 1
