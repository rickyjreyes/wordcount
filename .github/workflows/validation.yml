name: Scientific Sorting Validation
on:
  pull_request:
  push:
    branches: ["feature/thorough-sort-validation"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Smoke or extended comparison (all timings preliminary)"
        type: choice
        required: true
        default: smoke
        options: [smoke, extended]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            modern/pom.xml
            modern/benchmarks/pom.xml
      - name: Compile original unchanged coursework and run correctness tests
        run: |
          javac source_code/*.java
          mvn -B -f modern/pom.xml verify install
      - name: Capture machine/commit metadata and paired validation samples
        run: |
          mkdir -p modern/target/thorough
          git rev-parse HEAD > modern/target/thorough/commit.txt
          (uname -a; lscpu; java -version 2>&1; free -h) > modern/target/thorough/machine.txt
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ThoroughLab --datasets random,equal,zipf,sparse,sorted,reverse,unicode,prefix --sizes 128,2048,8192 --seeds 2017,42,73 --methods jdk-native,merge,freqbucket,radix,sparsebucket,pdq,parallel,quick,heap,shell,hybrid,wct,rca,prime --runs 3 --warmup 1 --out modern/target/thorough
      - name: Assemble independent JMH benchmark module
        run: mvn -B -f modern/benchmarks/pom.xml package
      - name: JMH smoke (forked, not a generalized performance claim)
        if: github.event_name != 'workflow_dispatch' || inputs.profile == 'smoke'
        run: |
          java -jar modern/benchmarks/target/wordcount-jmh.jar 'FullSortBenchmark.fullSort' -p dataset=random -p n=8192 -p seed=2017 -p algorithm=freqbucket,merge,jdk-native,pdq -wi 1 -i 2 -w 200ms -r 200ms -f 1 -t 1 -prof gc -rf json -rff modern/target/thorough/jmh-smoke.json | tee modern/target/thorough/jmh-smoke.txt
      - name: JMH extended (multiple datasets, seeds, sizes, forks)
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'extended'
        run: |
          java -jar modern/benchmarks/target/wordcount-jmh.jar 'FullSortBenchmark.fullSort' -p dataset=random,zipf,sparse,equal -p n=8192,32768 -p seed=2017,42,73 -p algorithm=freqbucket,merge,jdk-native,pdq,sparsebucket -wi 2 -i 3 -w 300ms -r 300ms -f 2 -t 1 -prof gc -rf json -rff modern/target/thorough/jmh-extended.json | tee modern/target/thorough/jmh-extended.txt
      - name: Upload raw evidence and environment (including negative results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-sort-validation-${{ github.run_id }}
          path: modern/target/thorough/
          if-no-files-found: warn
