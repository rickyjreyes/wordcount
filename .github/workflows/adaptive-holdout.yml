name: Frozen Adaptive V1 Holdout
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  prospective-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            modern/pom.xml
            modern/benchmarks/pom.xml
      - name: Record frozen revision and machine details
        run: |
          mkdir -p modern/target/holdout
          git rev-parse HEAD > modern/target/holdout/commit.txt
          (uname -a; lscpu; java -version 2>&1; free -h) > modern/target/holdout/machine.txt
      - name: Test exact correctness and holdout report analyzer
        run: |
          mvn -B -f modern/pom.xml verify install
          python3 -m unittest discover -s modern/tools/tests -v
      - name: Single preregistered holdout matrix (all evidence retained)
        run: |
          java -cp modern/target/wordcount-lab-1.0.0.jar org.wordcountlab.experimental.ThoroughLab --datasets random,sorted,reverse,nearly,few-counts,equal,runs,zipf,sparse,unicode,prefix,staircase,alternating,clusters --sizes 512,2048,8192 --seeds 101,4099,65537,9001,20261 --methods adaptive-v1,hybrid,merge,freqbucket,jdk-native,rca,pdq,sparsebucket,parallel,radix,wct --runs 3 --warmup 1 --out modern/target/holdout
      - name: Audit all 6930 raw records and evaluate frozen P0-P3
        run: |
          python3 modern/tools/holdout_report.py modern/target/holdout | tee modern/target/holdout/audit_stdout.txt
      - name: Build standalone benchmark package
        run: mvn -B -f modern/benchmarks/pom.xml package
      - name: Short JMH execution smoke (NOT primary outcome)
        run: |
          set -o pipefail
          java -jar modern/benchmarks/target/wordcount-jmh.jar 'FullSortBenchmark.fullSort' -p dataset=random -p n=8192 -p seed=101 -p algorithm=adaptive-v1,hybrid,merge,freqbucket,jdk-native -wi 1 -i 2 -w 200ms -r 200ms -f 1 -t 1 -prof gc -rf json -rff modern/target/holdout/jmh-smoke.json | tee modern/target/holdout/jmh-smoke.txt
      - name: Upload raw samples, complete negative findings, and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-v1-frozen-holdout-${{ github.run_id }}
          path: modern/target/holdout/
          if-no-files-found: warn
